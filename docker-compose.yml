# One command to run CivicAI.
#
# VERIFIED 2026-10-06: both images build, the stack comes up healthy, migrations and
# seeding run, and a complaint submitted to the container was classified ELECTRICITY
# and assigned. Review found five defects before it was ever run; running it found two
# more — no .dockerignore (a 319 MB host virtualenv in the build context) and no way to
# seed a first tenant, because the HTTP seed endpoint is gated on
# ENVIRONMENT=development.
#
#   SECRET_KEY=$(openssl rand -hex 32) GEMINI_API_KEY=... docker compose up --build
#
# Then once, to build the retrieval index. It needs the embedding API, so it cannot be
# a build step; the /data volume keeps it across restarts:
#
#   docker exec civicai-backend-1 python -m app.ai.rag.ingest --collection all
#
# Note: `docker compose exec` re-interpolates this file, so it wants SECRET_KEY set
# too. `docker exec` on the container name does not.
#
# Both variables matter:
#   - SECRET_KEY: `environment` defaults to "production" and `secret_key` to a known
#     placeholder, and app/main.py refuses to boot on that combination. Without it the
#     backend crash-loops, which is exactly what the previous version of this file did.
#   - GEMINI_API_KEY: without it the API still boots and complaints are still accepted,
#     but every pipeline run fails at its first model call.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # SQLite, because that is what this project actually runs on. See the
      # commented postgres service below for why it is not the default.
      DATABASE_URL: sqlite:////data/civicai.db
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY, e.g. $(openssl rand -hex 32)}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      BACKGROUND_JOBS_ENABLED: ${BACKGROUND_JOBS_ENABLED:-true}
      RAG_INDEX_DIR: /data/index
    volumes:
      - ./backend/uploads:/app/uploads
      # The database and the FAISS index both live here. Without a volume the index
      # is rebuilt — at an embedding-API cost — every time the container is replaced.
      - civicai-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  civicai-data:

# ── Postgres is deliberately not the default ────────────────────────────────
#
# The models were written to work on both (String(36) ids rather than a PG UUID
# type, JSON rather than ARRAY), but:
#
#   1. requirements.txt contains no Postgres driver, so a postgresql:// URL fails
#      at import with "No module named psycopg2". The previous version of this file
#      pointed the backend at Postgres anyway.
#   2. No migration has ever been run against Postgres, and two of them use
#      batch_alter_table, which exists for SQLite's benefit.
#   3. No test runs against Postgres.
#
# Making it the default would be claiming something untested. To use it: add
# `psycopg[binary]` to requirements.txt, set DATABASE_URL, run the migrations, and
# expect to find things.
#
#  db:
#    image: postgres:16
#    environment:
#      POSTGRES_USER: civicai
#      POSTGRES_PASSWORD: civicai
#      POSTGRES_DB: civicai
#    volumes:
#      - pgdata:/var/lib/postgresql/data
#    healthcheck:
#      test: ["CMD-SHELL", "pg_isready -U civicai"]
#      interval: 5s
#      retries: 10
