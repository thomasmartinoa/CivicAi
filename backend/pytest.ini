[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Narrow, targeted ignores for one known Python 3.14 stdlib deprecation that
# fastapi/starlette/pytest-asyncio trigger internally (none of it is our
# code, none of it is fixable here). Deliberately NOT a blanket
# `ignore::DeprecationWarning` — Phase 1 depends on LangChain/LangGraph
# deprecation warnings actually surfacing.
filterwarnings =
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:fastapi.routing
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:starlette\._utils
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:pytest_asyncio.plugin
    ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio.plugin
    # Same stdlib deprecation family as above, triggered only now that
    # test_runner.py is the first module with `async def test_` functions
    # (asyncio_mode = auto has pytest-asyncio set an event loop policy per test).
    ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio.plugin
    # langchain-core imports pydantic.v1 defensively at module-import time and
    # warns under Python 3.14. Verified not on our call path: binding a pydantic
    # v2 model via with_structured_output succeeds and returns a RunnableSequence.
    # Scoped to this exact message and module so real LangChain warnings still show.
    ignore:Core Pydantic V1 functionality isn't compatible:UserWarning:langchain_core.utils.pydantic
    # google-genai deprecation warning under Python 3.14. Not our code; happens at
    # construction time and does not affect functionality.
    ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai.types
