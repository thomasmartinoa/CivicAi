[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Narrow, targeted ignores for one known Python 3.14 stdlib deprecation that
# fastapi/starlette/pytest-asyncio trigger internally (none of it is our
# code, none of it is fixable here). Deliberately NOT a blanket
# `ignore::DeprecationWarning` — Phase 1 depends on LangChain/LangGraph
# deprecation warnings actually surfacing.
filterwarnings =
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:fastapi.routing
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:starlette\._utils
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:pytest_asyncio.plugin
    ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio.plugin
